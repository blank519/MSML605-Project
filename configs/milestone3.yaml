# configs/milestone3.yaml
# -----------------------------------------------------------------------
# Milestone 3 configuration — embedding-based inference and deployment.
# Extends milestone2.yaml conventions; adds embedding, inference, and
# load-test configuration.
# -----------------------------------------------------------------------

# ---- Shared settings (carry-over from Milestones 1 & 2) ---------------
seed: 42

data_source: "tensorflow_datasets: lfw (latest)"

splits:
  policy: "image-level random split"
  val_frac: 0.15
  test_frac: 0.15

paths:
  data_cache: data/tfds_cache
  outputs:    outputs

pairs:
  positive_per_split: 5000
  negative_per_split: 5000

# ---- Training settings (used by train.py) -----------------------------
training:
  image_size: [160, 160]
  batch_size: 32
  epochs:     5
  learning_rate: 0.001
  embedder_type: "facenet"   # uses FaceNetEmbedder (keras-facenet / VGGFace2)

# ---- Milestone 3 — embedding and inference settings -------------------
milestone3:
  config_name: milestone3_facenet

  # Embedding model used by the CLI and load test (src/embedder.py).
  # Must match the embedder_type used during training above.
  # keras-facenet: InceptionResnetV1 pretrained on VGGFace2, 512-dim output.
  embedding_model: keras_facenet
  embedding_dim: 512

  # Score direction:
  # Cosine similarity of L2-normalised embeddings -> sigmoid -> [0, 1].
  # Higher score = more likely same person.
  # This matches SiameseVerifier.predict_proba() and the scored CSVs.
  score_direction: "higher_is_more_similar"
  score_range: "[0, 1] (sigmoid of cosine similarity)"

  # Confidence computation rule (documented):
  #   SAME      (score >= threshold): (score - threshold) / (1 - threshold)
  #   DIFFERENT (score < threshold):  (threshold - score) / threshold
  # Range: [0, 1]. 0 = at the decision boundary. 1 = maximum confidence.
  confidence_rule: "linear_distance_from_threshold"

  # Threshold selection — same TAR@FAR=0.01 rule as Milestone 2.
  # Re-selected on the val split using FaceNet sigmoid scores.
  threshold_selection_split: val
  reporting_split: test
  selection_rule: "TAR@FAR=0.01"
  target_far: 0.01

  # Set this after running run_threshold_sweep.py with FaceNet scores.
  locked_threshold: 0.709294

  # Data version
  data_version: v2

  # Threshold sweep settings
  sweep:
    n_steps: 200

  # Load test defaults
  load_test:
    default_workers: 2
    default_n_pairs: 50
    split: val

# ---- Milestone 2 settings (preserved for backbone compatibility) -------
milestone2:
  config_name: milestone2_baseline
  threshold_selection_split: val
  reporting_split: test
  selection_rule: "TAR@FAR=0.01"
  target_far: 0.01
  locked_threshold: 0.709294
  data_version: v2
  score_direction: "higher_is_more_similar"
  sweep:
    n_steps: 200
